<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="logo.png?v=2">
    <link rel="icon" type="image/png" href="logo.png?v=2">
    <link rel="manifest" href="manifest.json">
    <title>Milion Plechovek | Sběrač</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- Leaflet Mapa -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Hlavička s logem -->
        <header class="header">
            <a href="index.html">
                <img src="logo.png" alt="Milion Plechovek Logo" class="brand-logo">
            </a>
        </header>

        <!-- Registrace Nickname -->
        <div id="loginScreen" class="card hidden">
            <h3>Jak ti máme říkat?</h3>
            <p class="small-text">Vymysli si přezdívku nebo zadej svůj IG, ať se najdeš v žebříčku.</p>
            <input type="text" id="nicknameInput" placeholder="@pepa_sbira">
            <button id="saveNickBtn" class="primary-btn-small">Uložit</button>
        </div>

        <!-- HLAVNÍ SEKCE (HOME) -->
        <div id="homeSection" class="view-section">
            <div class="stats-row" id="statsRow">
                <div class="stat-card" id="myStatsCard">
                    <h3>MOJE STATISTIKY</h3>
                    <div class="stat-value" id="myTotal">0</div>
                    <p><span id="userNickDisplay">...</span></p>
                </div>
                <div class="stat-card">
                    <h3>CELKEM ZBÝVÁ</h3>
                    <div class="stat-value highlight" id="globalTotal">999 171</div>
                </div>
            </div>

            <!-- Vycentrované Tlačítko -->
            <div class="main-action-center" id="mainAction">
                <button id="cameraBtn" class="primary-btn-large">
                    <span class="icon">📸</span><br>FOTIT
                </button>
                <button id="galleryBtn" class="gallery-link">📂 nebo z galerie</button>
                <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
                <input type="file" id="galleryInput" accept="image/*" style="display: none;">
            </div>

            <div id="historyPanel" class="card history-card">
                <h3>Poslední úlovky</h3>
                <ul id="historyList" class="history-list"></ul>
            </div>
        </div>

        <!-- SEKCE MAPA -->
        <div id="mapSection" class="view-section hidden">
            <div class="card map-full-card">
                <h3>Mapa nálezů</h3>
                <div id="map"></div>
            </div>
        </div>

        <!-- SEKCE ŽEBŘÍČEK -->
        <div id="leaderboardSection" class="view-section hidden">
            <div class="card leaderboard-card">
                <h3>Žebříček sběračů</h3>
                <ul id="leaderboardList" class="leaderboard-list">
                    <!-- Tady bude TOP 10 + uživatel -->
                </ul>
            </div>
        </div>

        <!-- FORMULÁŘE (MIMO HLAVNÍ NAVIGACI) -->
        <div id="pickupForm" class="card pickup-form hidden">
            <img id="photoPreview" alt="Náhled úlovku" class="photo-preview">
            <div class="form-group">
                <label for="canCount">Kolik plechovek je na fotce?</label>
                <input type="number" id="canCount" value="1" min="1" max="500">
            </div>
            <div class="form-group">
                <label for="notes">Poznámka:</label>
                <textarea id="notes" placeholder="Kde jsi to našel?"></textarea>
            </div>
            <div class="gps-status" id="gpsStatus">📍 Zjišťuji polohu...</div>
            <button id="submitBtn" class="submit-btn">Odeslat do odpočtu</button>
            <button id="cancelBtn" class="secondary-btn">Zrušit</button>
        </div>
        
        <div id="successScreen" class="card success-screen hidden">
            <h2>🎉 Skvělá práce!</h2>
            <p>Odečteno z celkového milionu.</p>
            <button id="shareBtn" class="share-btn">Sdílet úlovek</button>
            <button id="newPickupBtn" class="secondary-btn">Hotovo</button>
        </div>

        <!-- SPODNÍ NAVIGACE -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-view="home">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Domů</span>
            </button>
            <button class="nav-item" data-view="map">
                <span class="nav-icon">📍</span>
                <span class="nav-label">Mapa</span>
            </button>
            <button class="nav-item" data-view="leaderboard">
                <span class="nav-icon">🏆</span>
                <span class="nav-label">Žebříček</span>
            </button>
        </nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
